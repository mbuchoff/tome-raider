{% extends 'base.html' %}
{% block body %}
<h1>Sign in</h1>
<form method="post" class="card">
  <label for="passcode">Passcode</label>
  <input type="password" id="passcode" name="passcode" autocomplete="current-password" autofocus required>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <p><button type="submit">Sign in</button></p>
</form>
{% endblock %}
